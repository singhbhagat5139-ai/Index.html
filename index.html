<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Verification & Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 15px; font-family: Arial, sans-serif; background: #050d25; color: white; }
        .container { max-width: 1000px; margin: auto; padding: 25px; border: 1px solid #ffcc00; border-radius: 20px; background: #0c1939; }
        h1, h2 { color: #ffcc00; text-align: center; }
        .card { background: #101f42; border: 1px solid #263d70; border-radius: 14px; padding: 18px; margin: 20px 0; }
        label { display: block; margin: 12px 0 7px; color: #9fb4e8; font-weight: bold; }
        input, select { width: 100%; padding: 13px; border: 1px solid #293f78; border-radius: 10px; background: #03091b; color: white; font-size: 16px; }
        button { background: #ffcc00; color: #101010; border: none; padding: 12px 16px; border-radius: 9px; font-weight: bold; font-size: 15px; cursor: pointer; }
        button:hover { opacity: .85; }
        .primary { width: 100%; margin-top: 20px; font-size: 17px; padding: 16px; }
        .secondary { background: #294779; color: white; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
        .table-wrap { overflow-x: auto; border-radius: 10px; margin-top: 15px; }
        table { border-collapse: collapse; width: 100%; min-width: 900px; background: #0b1734; }
        th, td { border: 1px solid #263d70; padding: 12px; text-align: left; }
        th { color: #ffcc00; background: #172c55; }
        .login { max-width: 430px; margin: 60px auto; }
        .hidden { display: none !important; }
        .note { color: #a9b8d9; font-size: 13px; line-height: 1.6; }
    </style>
</head>
<body>

    <!-- ADMIN LOGIN -->
    <div class="container login" id="loginPage">
        <h1>🔐 Admin Login</h1>
        <div class="card">
            <label>Username</label>
            <input id="username" placeholder="Username">
            <label>Password</label>
            <input id="password" type="password" placeholder="Password">
            <button class="primary" onclick="login()">Login करें</button>
            <p id="loginError" style="color:#ff7777"></p>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="container hidden" id="dashboard">
        <h1>🛠️ Customer Sheet Control Dashboard</h1>
        <div class="toolbar">
            <button class="secondary" onclick="logout()">Logout</button>
        </div>

        <!-- SEARCH & VERIFY CUSTOMER DATA -->
        <div class="card">
            <h2>🔍 कस्टमर डेटा वेरीफाई करें (Sheet Check)</h2>
            <div class="form-grid">
                <div>
                    <label>लॉटरी नंबर दर्ज करें</label>
                    <input id="checkLottery" placeholder="e.g. KL-584920">
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button class="primary" style="margin-top:0;" onclick="verifyCustomerData()">शीट से जाँच करें</button>
                </div>
            </div>
            <p id="verifyResult" style="margin-top: 15px; color: #00e69a; font-weight: bold;"></p>
        </div>

        <!-- LIVE SHEET TABLE -->
        <h2>📊 Google Sheet Live Records</h2>
        <div class="toolbar">
            <input id="searchBox" placeholder="नाम या नंबर खोजें..." oninput="renderTable()">
            <button onclick="loadSheetData()">🔄 Refresh Sheet</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Lottery Number</th>
                        <th>Name</th>
                        <th>Mobile</th>
                        <th>Prize Level</th>
                        <th>UPI ID</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        "use strict";
        const DEMO_USER = "Raja";
        const DEMO_PASSWORD = "Raja@#8990";
        let records = [];
        const API_URL = "https://sheetdb.io/api/v1/vpi9mg3o0yk7q";

        function login() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value;
            if (user === DEMO_USER && pass === DEMO_PASSWORD) {
                sessionStorage.setItem("adminLoggedIn", "true");
                showDashboard();
            } else {
                document.getElementById("loginError").textContent = "गलत Username या Password";
            }
        }

        function showDashboard() {
            document.getElementById("loginPage").classList.add("hidden");
            document.getElementById("dashboard").classList.remove("hidden");
            loadSheetData();
        }

        function logout() {
            sessionStorage.removeItem("adminLoggedIn");
            document.getElementById("dashboard").classList.add("hidden");
            document.getElementById("loginPage").classList.remove("hidden");
        }

        async function loadSheetData() {
            try {
                let res = await fetch(API_URL);
                let data = await res.json();
                records = data.map((item, index) => ({
                    lottery: item.lottery || item.Lottery || "",
                    name: item.name || item.Name || "",
                    mobile: item.mobile || item.Mobile || "",
                    prize: item.prize || item.Prize || "",
                    upi: item.upi || item.UPI || "",
                    amount: item.amount || item.Amount || "0",
                    status: item.status || item.Status || "Pending"
                }));
                renderTable();
            } catch (err) {
                console.error("Error loading sheet:", err);
            }
        }

        function verifyCustomerData() {
            const query = document.getElementById("checkLottery").value.trim().toLowerCase();
            const resultBox = document.getElementById("verifyResult");
            
            if (!query) {
                resultBox.textContent = "कृपया जाँच के लिए लॉटरी नंबर लिखें।";
                return;
            }

            const found = records.find(r => String(r.lottery).toLowerCase() === query);
            if (found) {
                resultBox.innerHTML = `✅ डेटा मिल गया!<br>नाम: ${found.name} | प्राइज: ${found.prize} | राशि: ₹${found.amount} | स्थिति: ${found.status}`;
            } else {
                resultBox.textContent = "❌ यह लॉटरी नंबर Google Sheet में नहीं मिला।";
            }
        }

        function renderTable() {
            const body = document.getElementById("tableBody");
            const query = document.getElementById("searchBox").value.trim().toLowerCase();
            body.replaceChildren();
            
            const filtered = records.filter(record => 
                [record.name, record.mobile, record.lottery].some(v => String(v || "").toLowerCase().includes(query))
            );

            filtered.forEach(record => {
                const row = document.createElement("tr");
                [record.lottery, record.name, record.mobile, record.prize, record.upi, "₹" + record.amount, record.status].forEach(val => {
                    const cell = document.createElement("td");
                    cell.textContent = val || "-";
                    row.appendChild(cell);
                });
                body.appendChild(row);
            });
        }

        if (sessionStorage.getItem("adminLoggedIn") === "true") {
            showDashboard();
        }
    </script>
</body>
</html>
