<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel & Control Dashboard</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:15px;
 font-family:Arial,sans-serif;
 background:#080f2b;color:white
}
.container{
 max-width:1000px;margin:auto;padding:20px;
 background:#111d46;border:2px solid #ffd21c;
 border-radius:18px
}
h1,h2{color:#ffd21c}
.card{
 background:#0a1536;padding:15px;
 border:1px solid #334477;
 border-radius:12px;margin:15px 0
}
input,select{
 width:100%;padding:12px;margin:7px 0;
 border-radius:7px;border:1px solid #435580;
 background:#050b1c;color:white
}
button{
 padding:11px 15px;margin:5px 3px;
 border:0;border-radius:7px;
 background:#ffd21c;color:#111;
 font-weight:bold;cursor:pointer
}
.secondary{background:#20345e;color:white}
.grid{
 display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{border:1px solid #34436b;padding:10px;text-align:left}
th{color:#ffd21c}
.hidden{display:none}
#message{white-space:pre-wrap;color:#ffd21c}
@media(max-width:600px){
 .grid{grid-template-columns:1fr}
 .container{padding:12px}
}
</style>
</head>

<body>
<div class="container">

<h1>🎛️ Admin Control Panel</h1>

<!-- LOGIN -->
<div class="card" id="loginBox">
<h2>🔐 Admin Login</h2>

<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<p id="loginMessage"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<div class="card">
<h2>💳 UPI & Helpline Settings</h2>

<label>UPI ID</label>
<input id="upi" placeholder="example@upi">

<label>Helpline Number</label>
<input id="helpline" placeholder="Mobile number">

<button onclick="saveSettings()">Save Settings</button>
</div>

<div class="card">
<h2>➕ Add Record</h2>

<div class="grid">
<div>
<label>Name</label>
<input id="name" placeholder="Winner name">
</div>

<div>
<label>Mobile Number</label>
<input id="mobile" maxlength="10" inputmode
