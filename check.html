<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Status Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .portal-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333333;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555555;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #1a73e8;
        }
        button {
            width: 100%;
            padding: 11px;
            background-color: #1a73e8;
            border: none;
            color: white;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1557b0;
        }
        button:disabled {
            background-color: #9bbdf3;
            cursor: not-allowed;
        }
        .msg {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
        .msg-error {
            color: #d93025;
        }
        .msg-loading {
            color: #5f6368;
        }
        .result-box {
            display: none;
            margin-top: 20px;
            border-top: 1px solid #e0e0e0;
            padding-top: 15px;
        }
        .row-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f1f1f1;
            font-size: 14px;
        }
        .row-item:last-child {
            border-bottom: none;
        }
        .row-label {
            color: #666666;
            font-weight: 500;
        }
        .row-val {
            color: #222222;
            font-weight: 600;
            text-align: right;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-paid {
            background-color: #ceead6;
            color: #0d652d;
        }
        .status-pending {
            background-color: #feefc3;
            color: #b06000;
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <h2>Customer Status Verification</h2>
        
        <div class="form-group">
            <label for="ticketInput">Ticket Number / Mobile Number</label>
            <input type="text" id="ticketInput" placeholder="Enter number..." autocomplete="off">
        </div>
        <button id="submitBtn" onclick="verifyStatus()">Check Status</button>

        <div id="loadingMsg" class="msg msg-loading">Searching records, please wait...</div>
        <div id="errorMsg" class="msg msg-error"></div>

        <div id="resultBox" class="result-box">
            <div class="row-item"><span class="row-label">Ticket No:</span> <span class="row-val" id="resTicket">-</span></div>
            <div class="row-item"><span class="row-label">Name:</span> <span class="row-val" id="resName">-</span></div>
            <div class="row-item"><span class="row-label">Mobile:</span> <span class="row-val" id="resMobile">-</span></div>
            <div class="row-item"><span class="row-label">Prize Level:</span> <span class="row-val" id="resPrize">-</span></div>
            <div class="row-item"><span class="row-label">Prize Amount:</span> <span class="row-val" id="resAmount" style="color: #0d652d;">-</span></div>
            <div class="row-item"><span class="row-label">Fee:</span> <span class="row-val" id="resFee">-</span></div>
            <div class="row-item"><span class="row-label">UPI ID:</span> <span class="row-val" id="resUpi">-</span></div>
            <div class="row-item">
                <span class="row-label">Status:</span> 
                <span class="row-val"><span id="resStatus" class="status-badge">-</span></span>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/u2lswkzde626d";

        function cleanText(val) {
            return String(val || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
        }

        function extractVal(row, fieldNames) {
            for (const col in row) {
                const cleanedCol = cleanText(col);
                for (const target of fieldNames) {
                    if (cleanedCol === cleanText(target)) {
                        return row[col];
                    }
                }
            }
            return "";
        }

        async function verifyStatus() {
            const queryRaw = document.getElementById("ticketInput").value.trim();
            const queryClean = cleanText(queryRaw);
            const resultBox = document.getElementById("resultBox");
            const errorMsg = document.getElementById("errorMsg");
            const loadingMsg = document.getElementById("loadingMsg");
            const submitBtn = document.getElementById("submitBtn");

            if (!queryClean) {
                errorMsg.textContent = "Please enter a valid Ticket or Mobile Number.";
                errorMsg.style.display = "block";
                resultBox.style.display = "none";
                return;
            }

            errorMsg.style.display = "none";
            resultBox.style.display = "none";
            loadingMsg.style.display = "block";
            submitBtn.disabled = true;

            try {
                const res = await fetch(API_URL);
                const data = await res.json();

                const record = data.find(item => {
                    const ticketVal = cleanText(extractVal(item, ["ticket", "ticketnumber", "ticket_no"]) || Object.values(item)[0]);
                    const mobileVal = cleanText(extractVal(item, ["mobile", "phone", "number", "contact", "mobileno"]));
                    return (ticketVal && ticketVal === queryClean) || (mobileVal && mobileVal === queryClean);
                });

                loadingMsg.style.display = "none";
                submitBtn.disabled = false;

                if (record) {
                    document.getElementById("resTicket").textContent = extractVal(record, ["ticket", "ticketnumber", "ticket_no"]) || "-";
                    document.getElementById("resName").textContent = extractVal(record, ["name", "winner", "customer"]) || "-";
                    document.getElementById("resMobile").textContent = extractVal(record, ["mobile", "phone", "number"]) || "-";
                    document.getElementById("resPrize").textContent = extractVal(record, ["prize", "prizelevel", "level"]) || "-";
                    
                    const amt = extractVal(record, ["amount", "prizeamount", "winningamount"]);
                    document.getElementById("resAmount").textContent = amt ? "₹" + amt : "-";

                    const fee = extractVal(record, ["fee", "registrationfee", "charge"]);
                    document.getElementById("resFee").textContent = fee ? "₹" + fee : "-";

                    document.getElementById("resUpi").textContent = extractVal(record, ["upi", "upiid", "upi_id"]) || "-";

                    const status = extractVal(record, ["status", "paymentstatus"]) || "Pending";
                    const badge = document.getElementById("resStatus");
                    badge.textContent = status;

                    if (cleanText(status).includes("paid") || cleanText(status).includes("approved")) {
                        badge.className = "status-badge status-paid";
                    } else {
                        badge.className = "status-badge status-pending";
                    }

                    resultBox.style.display = "block";
                } else {
                    errorMsg.textContent = "No record found. Please verify the entered number.";
                    errorMsg.style.display = "block";
                }
            } catch (err) {
                loadingMsg.style.display = "none";
                submitBtn.disabled = false;
                errorMsg.textContent = "Unable to connect to the database. Please try again.";
                errorMsg.style.display = "block";
            }
        }
    </script>
</body>
</html>
